<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Manifest Studio v3</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --rp-color: #4caf50;
            --bp-color: #f44336;
            --bg-dark: #121212;
            --card-bg: #1e1e26;
            --input-bg: #2d2d3a;
        }

        * { box-sizing: border-box; }

        body {
            background: #000;
            color: #fff;
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: var(--card-bg);
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.7);
            border: 1px solid rgba(255,255,255,0.1);
            overflow: hidden;
        }

        /* Navigasi Tab Tetap Di Atas */
        .tabs-header {
            display: flex;
            background: #15151b;
            padding: 10px;
            gap: 10px;
        }

        .tab-btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 700;
            font-size: 11px;
            text-align: center;
            background: #252530;
            color: #666;
            transition: 0.3s;
        }

        /* Status Aktif Tombol */
        .tab-btn.active-rp { background: var(--rp-color) !important; color: white !important; }
        .tab-btn.active-bp { background: var(--bp-color) !important; color: white !important; }

        .content { padding: 20px; }

        .field { margin-bottom: 15px; }
        label { display: block; font-size: 10px; font-weight: 600; color: #aaa; margin-bottom: 5px; text-transform: uppercase; }

        input {
            width: 100%;
            background: var(--input-bg);
            border: 2px solid #333;
            padding: 12px;
            border-radius: 10px;
            color: #fff;
            outline: none;
            font-size: 14px;
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin: 15px 0;
        }

        .btn {
            flex: 1;
            min-width: 100px;
            padding: 12px;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            font-size: 11px;
            cursor: pointer;
            color: #fff;
        }

        .btn-copy { background: #444; }
        .btn-dl { background: #007acc; }

        /* Area Kode */
        pre {
            background: #000;
            padding: 15px;
            border-radius: 12px;
            font-family: monospace;
            font-size: 11px;
            color: #00ff87;
            border: 1px solid #333;
            white-space: pre-wrap;
            word-wrap: break-word;
            margin-top: 10px;
        }

        .help-text {
            font-size: 10px;
            color: #ff9800;
            margin-bottom: 10px;
            display: none;
            background: rgba(255, 152, 0, 0.1);
            padding: 8px;
            border-radius: 5px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="tabs-header">
        <button id="btnRP" class="tab-btn active-rp" onclick="toggleMode('rp')">🎨 RESOURCE</button>
        <button id="btnBP" class="tab-btn" onclick="toggleMode('bp')">⚙️ BEHAVIOR</button>
    </div>

    <div class="content">
        <div id="helpMsg" class="help-text">
            ⚠️ <b>Penting:</b> Masukkan UUID Header dari Resource Pack Anda di bawah agar BP ini terhubung.
        </div>

        <div class="field">
            <label>Nama Pack</label>
            <input type="text" id="pName" value="My New Pack" oninput="updateJSON()">
        </div>

        <div class="field" id="bpDependency" style="display: none;">
            <label>Link RP UUID (Header)</label>
            <input type="text" id="rpUUID" placeholder="Tempel UUID RP di sini..." oninput="updateJSON()">
        </div>

        <div class="actions">
            <button class="btn btn-copy" onclick="copyJSON()">📋 SALIN</button>
            <button class="btn btn-dl" onclick="downloadJSON()">💾 SIMPAN</button>
        </div>

        <pre id="codeArea"></pre>
    </div>
</div>

<script>
    let mode = 'rp';
    let idData = {
        rp: { h: crypto.randomUUID(), m: crypto.randomUUID() },
        bp: { h: crypto.randomUUID(), m: crypto.randomUUID() }
    };

    function toggleMode(target) {
        mode = target;
        
        // Update tampilan tombol tab
        document.getElementById('btnRP').classList.toggle('active-rp', mode === 'rp');
        document.getElementById('btnBP').classList.toggle('active-bp', mode === 'bp');

        // Tampilkan/Sembunyikan input khusus BP
        const depBox = document.getElementById('bpDependency');
        const help = document.getElementById('helpMsg');
        
        if (mode === 'bp') {
            depBox.style.display = 'block';
            help.style.display = 'block';
        } else {
            depBox.style.display = 'none';
            help.style.display = 'none';
        }
        
        updateJSON();
    }

    function updateJSON() {
        const name = document.getElementById('pName').value || "Unnamed";
        const rpLink = document.getElementById('rpUUID').value;
        const currentIds = idData[mode];

        const manifest = {
            format_version: 2,
            header: {
                name: name,
                description: "Generated by Studio",
                uuid: currentIds.h,
                version: [1, 0, 0],
                min_engine_version: [1, 21, 0]
            },
            modules: [
                {
                    description: "Module Pack",
                    type: (mode === 'rp' ? "resources" : "data"),
                    uuid: currentIds.m,
                    version: [1, 0, 0]
                }
            ]
        };

        // Jika mode BP dan ada link RP, masukkan ke dependency
        if (mode === 'bp' && rpLink.trim() !== "") {
            manifest.dependencies = [{ uuid: rpLink.trim(), version: [1, 0, 0] }];
        }

        document.getElementById('codeArea').textContent = JSON.stringify(manifest, null, 4);
    }

    function copyJSON() {
        const code = document.getElementById('codeArea').textContent;
        navigator.clipboard.writeText(code);
        alert("Berhasil disalin ke clipboard!");
    }

    function downloadJSON() {
        const code = document.getElementById('codeArea').textContent;
        const blob = new Blob([code], {type: "application/json"});
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = "manifest.json";
        a.click();
    }

    // Jalankan pertama kali
    updateJSON();
</script>

</body>
</html>
