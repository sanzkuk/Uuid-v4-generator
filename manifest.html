<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Manifest Studio v4.0</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --rp-color: #4caf50;
            --bp-color: #f44336;
            --bg-dark: #121212;
            --card-bg: #1e1e26;
            --input-bg: #2d2d3a;
            --accent: #00ff87;
        }

        * { box-sizing: border-box; }

        body {
            background: #000;
            color: #fff;
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: var(--card-bg);
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.7);
            border: 1px solid rgba(255,255,255,0.1);
            overflow: hidden;
        }

        .tabs-header {
            display: flex;
            background: #15151b;
            padding: 10px;
            gap: 10px;
        }

        .tab-btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 700;
            font-size: 11px;
            text-align: center;
            background: #252530;
            color: #666;
            transition: 0.3s;
        }

        .tab-btn.active-rp { background: var(--rp-color) !important; color: white !important; }
        .tab-btn.active-bp { background: var(--bp-color) !important; color: white !important; }

        .content { padding: 20px; }

        .field { margin-bottom: 15px; }
        label { display: block; font-size: 10px; font-weight: 600; color: #aaa; margin-bottom: 5px; text-transform: uppercase; }

        input, select {
            width: 100%;
            background: var(--input-bg);
            border: 2px solid #333;
            padding: 12px;
            border-radius: 10px;
            color: #fff;
            outline: none;
            font-size: 14px;
        }

        .script-section {
            background: rgba(0,0,0,0.2);
            padding: 15px;
            border-radius: 12px;
            border: 1px dashed #444;
            margin-top: 10px;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
        }

        .checkbox-group input { width: auto; cursor: pointer; }
        .checkbox-group label { margin-bottom: 0; text-transform: none; color: #fff; cursor: pointer; }

        .module-list {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 10px;
        }

        .actions {
            display: flex;
            gap: 10px;
            margin: 15px 0;
        }

        .btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            font-size: 11px;
            cursor: pointer;
            color: #fff;
        }

        .btn-copy { background: #444; }
        .btn-dl { background: #007acc; }

        pre {
            background: #000;
            padding: 15px;
            border-radius: 12px;
            font-family: monospace;
            font-size: 11px;
            color: var(--accent);
            border: 1px solid #333;
            white-space: pre-wrap;
            overflow-x: auto;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="tabs-header">
        <button id="btnRP" class="tab-btn active-rp" onclick="toggleMode('rp')">🎨 RESOURCE</button>
        <button id="btnBP" class="tab-btn" onclick="toggleMode('bp')">⚙️ BEHAVIOR</button>
    </div>

    <div class="content">
        <div class="field">
            <label>Nama Pack</label>
            <input type="text" id="pName" value="My New Pack" oninput="updateJSON()">
        </div>

        <div id="bpOptions" style="display: none;">
            <div class="field">
                <label>RP UUID Link (Dependency)</label>
                <input type="text" id="rpUUID" placeholder="Tempel UUID RP di sini..." oninput="updateJSON()">
            </div>

            <div class="script-section">
                <div class="checkbox-group">
                    <input type="checkbox" id="useScript" onchange="updateJSON()">
                    <label style="color: var(--accent); font-weight: bold;">Gunakan Script API</label>
                </div>

                <div id="scriptControls" style="display:none; margin-top: 10px; border-top: 1px solid #444; padding-top: 10px;">
                    <label>Pilih Module Dependencies:</label>
                    <div class="module-list">
                        <div class="checkbox-group">
                            <input type="checkbox" class="mod-check" value="@minecraft/server" checked onchange="updateJSON()">
                            <label>Server</label>
                        </div>
                        <div class="checkbox-group">
                            <input type="checkbox" class="mod-check" value="@minecraft/server-ui" onchange="updateJSON()">
                            <label>Server-UI</label>
                        </div>
                        <div class="checkbox-group">
                            <input type="checkbox" class="mod-check" value="@minecraft/server-net" onchange="updateJSON()">
                            <label>Net</label>
                        </div>
                        <div class="checkbox-group">
                            <input type="checkbox" class="mod-check" value="@minecraft/server-admin" onchange="updateJSON()">
                            <label>Admin</label>
                        </div>
                    </div>
                    <div class="field" style="margin-top: 15px;">
                        <label>Versi Module (Universal)</label>
                        <input type="text" id="sVersion" value="1.13.0" oninput="updateJSON()">
                    </div>
                </div>
            </div>
        </div>

        <div class="actions">
            <button class="btn btn-copy" onclick="copyJSON()">📋 SALIN</button>
            <button class="btn btn-dl" onclick="downloadJSON()">💾 SIMPAN</button>
        </div>

        <pre id="codeArea"></pre>
    </div>
</div>

<script>
    let mode = 'rp';
    const ids = {
        rp: { h: crypto.randomUUID(), m: crypto.randomUUID() },
        bp: { h: crypto.randomUUID(), m: crypto.randomUUID(), s: crypto.randomUUID() }
    };

    function toggleMode(target) {
        mode = target;
        document.getElementById('btnRP').classList.toggle('active-rp', mode === 'rp');
        document.getElementById('btnBP').classList.toggle('active-bp', mode === 'bp');
        document.getElementById('bpOptions').style.display = (mode === 'bp') ? 'block' : 'none';
        updateJSON();
    }

    function updateJSON() {
        const name = document.getElementById('pName').value || "Unnamed Pack";
        const rpLink = document.getElementById('rpUUID').value.trim();
        const useScript = document.getElementById('useScript').checked;
        
        document.getElementById('scriptControls').style.display = useScript ? 'block' : 'none';

        const manifest = {
            format_version: 2,
            header: {
                name: name,
                description: "Dibuat dengan Manifest Studio",
                uuid: ids[mode].h,
                version: [1, 0, 0],
                min_engine_version: [1, 21, 0]
            },
            modules: [
                {
                    description: "Main Module",
                    type: (mode === 'rp' ? "resources" : "data"),
                    uuid: ids[mode].m,
                    version: [1, 0, 0]
                }
            ]
        };

        if (mode === 'bp') {
            manifest.dependencies = [];

            if (useScript) {
                // Tambah module script ke modules
                manifest.modules.push({
                    description: "Scripting Module",
                    language: "javascript",
                    type: "script",
                    uuid: ids.bp.s,
                    entry: "scripts/main.js",
                    version: [1, 0, 0]
                });

                // Ambil semua module yang dicentang
                const checkboxes = document.querySelectorAll('.mod-check:checked');
                const sVer = document.getElementById('sVersion').value;
                
                checkboxes.forEach(cb => {
                    manifest.dependencies.push({
                        module_name: cb.value,
                        version: sVer
                    });
                });
            }

            // Tambah Link RP jika ada
            if (rpLink !== "") {
                manifest.dependencies.push({ uuid: rpLink, version: [1, 0, 0] });
            }

            // Hapus array dependencies jika kosong agar JSON bersih
            if (manifest.dependencies.length === 0) delete manifest.dependencies;
        }

        document.getElementById('codeArea').textContent = JSON.stringify(manifest, null, 4);
    }

    function copyJSON() {
        navigator.clipboard.writeText(document.getElementById('codeArea').textContent);
        alert("Kode disalin!");
    }

    function downloadJSON() {
        const blob = new Blob([document.getElementById('codeArea').textContent], {type: "application/json"});
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = "manifest.json";
        a.click();
    }

    updateJSON();
</script>

</body>
</html>
